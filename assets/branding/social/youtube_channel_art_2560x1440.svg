<?xml version="1.0" encoding="UTF-8"?>
<!--
  YouTube channel art — 2560 × 1440.

  Safe-area math (YouTube specifies these):
    * TV display:      whole 2560 × 1440 canvas
    * Desktop:         center 2560 × 423 (top crop top=508, bottom=931)
    * Tablet:          center 1855 × 423
    * Mobile:          center 1546 × 423 (THE most important safe area)

  All critical content (wordmark, tagline, URL) sits within the
  central 1546 × 423 box -- visible across every device class.

  Decorative elements (gradient haloes, secondary tagline lines) can
  bleed outside the safe area to fill the TV/desktop edges.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" role="img" aria-label="Kultivar YouTube channel art">
  <defs>
    <radialGradient id="yt-glow-c" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#00C896" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00C896" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="yt-glow-l" cx="15%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#7B61FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="yt-glow-r" cx="85%" cy="60%" r="35%">
      <stop offset="0%" stop-color="#FFB547" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFB547" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="2560" height="1440" fill="#0A0A0F"/>
  <rect width="2560" height="1440" fill="url(#yt-glow-c)"/>
  <rect width="2560" height="1440" fill="url(#yt-glow-l)"/>
  <rect width="2560" height="1440" fill="url(#yt-glow-r)"/>

  <!-- Subtle horizon grid for that "tech infrastructure" feel -->
  <g opacity="0.04" stroke="#00C896" stroke-width="1.5" fill="none">
    <line x1="0" y1="600" x2="2560" y2="600"/>
    <line x1="0" y1="720" x2="2560" y2="720"/>
    <line x1="0" y1="840" x2="2560" y2="840"/>
  </g>

  <!-- ── MOBILE SAFE AREA content (1546 × 423, centered) ──────────────
       Box spans x: 507-2053, y: 508-931 -->

  <!-- Icon — centered horizontally in the safe area -->
  <g transform="translate(1112, 540)">
    <rect width="160" height="160" rx="36" fill="#00C896"
          filter="drop-shadow(0 0 60px rgba(0,200,150,0.5))"/>
    <path d="M 44 36 L 44 124 M 44 80 L 100 36 M 44 80 L 112 124"
          stroke="#0A0A0F" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Wordmark below icon -->
  <text x="1280" y="780"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="92" font-weight="700" letter-spacing="-2" fill="#F0F0FF"
        text-anchor="middle">
    Kultivar
  </text>

  <!-- Tagline -->
  <text x="1280" y="850"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="36" font-weight="500" letter-spacing="-0.4" fill="#9090AA"
        text-anchor="middle">
    Your grow journal. <tspan fill="#00C896" font-weight="700">Not theirs.</tspan>
  </text>

  <!-- ── DESKTOP / TV decorative content (outside mobile safe area) ── -->

  <!-- Secondary text below safe area, visible on desktop/TV only -->
  <text x="1280" y="1020"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="24" font-weight="500" fill="#5A5A70" text-anchor="middle"
        letter-spacing="0.4">
    PRIVACY-FIRST GROW JOURNAL · BUILT IN SOUTH AFRICA
  </text>

  <!-- URL chip near bottom -->
  <g transform="translate(1120, 1080)">
    <rect width="320" height="56" rx="28" fill="none" stroke="#26263B" stroke-width="1.5"/>
    <text x="160" y="36"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="20" font-weight="600" fill="#00C896" text-anchor="middle"
          letter-spacing="0.6">
      KULTIVAR.IO
    </text>
  </g>
</svg>
