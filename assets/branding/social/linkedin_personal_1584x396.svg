<?xml version="1.0" encoding="UTF-8"?>
<!--
  LinkedIn personal-profile cover banner — 1584 × 396.

  Profile-picture overlay: LinkedIn places a circular avatar in the
  lower-left corner overlapping the banner.  The avatar spans roughly
  150px diameter starting at x=80, y=240 on this canvas.  Wordmark is
  positioned center-right so the avatar doesn't collide with it.

  Tagline angle: positioned as "indie SA founder shipping a Flutter
  app" — tech-credible framing for the LinkedIn audience.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" role="img" aria-label="Kultivar — privacy-first grow journal, built in South Africa">
  <defs>
    <radialGradient id="glow-li" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00C896" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#00C896" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-li-2" cx="10%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#7B61FF" stop-opacity="0.10"/>
      <stop offset="70%" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1584" height="396" fill="#0A0A0F"/>
  <rect width="1584" height="396" fill="url(#glow-li)"/>
  <rect width="1584" height="396" fill="url(#glow-li-2)"/>

  <!-- Right side: brand block (wordmark + tagline) -->
  <g transform="translate(560, 130)">
    <!-- Icon -->
    <rect width="68" height="68" rx="16" fill="#00C896" filter="drop-shadow(0 0 22px rgba(0,200,150,0.55))"/>
    <path d="M 18 15 L 18 53 M 18 34 L 42 15 M 18 34 L 47 53"
          stroke="#0A0A0F" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Wordmark + tagline to the right of icon -->
    <text x="92" y="44"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="54" font-weight="700" letter-spacing="-1.2" fill="#F0F0FF">
      Kultivar
    </text>
    <text x="92" y="84"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="22" font-weight="500" letter-spacing="-0.2" fill="#9090AA">
      Privacy-first grow journal · Built in South Africa
    </text>

    <!-- Three-pill badge row -->
    <g transform="translate(92, 120)" font-family="-apple-system, sans-serif"
       font-size="13" font-weight="600" letter-spacing="0.4">
      <g>
        <rect width="170" height="32" rx="16" fill="rgba(0,200,150,0.10)" stroke="rgba(0,200,150,0.30)"/>
        <text x="85" y="21" fill="#00C896" text-anchor="middle">🇿🇦 LAUNCHING IN SA</text>
      </g>
      <g transform="translate(184, 0)">
        <rect width="140" height="32" rx="16" fill="rgba(123,97,255,0.10)" stroke="rgba(123,97,255,0.30)"/>
        <text x="70" y="21" fill="#7B61FF" text-anchor="middle">9 LANGUAGES</text>
      </g>
      <g transform="translate(338, 0)">
        <rect width="160" height="32" rx="16" fill="rgba(255,181,71,0.10)" stroke="rgba(255,181,71,0.30)"/>
        <text x="80" y="21" fill="#FFB547" text-anchor="middle">FLUTTER · ANDROID</text>
      </g>
    </g>
  </g>

  <!-- URL bottom right -->
  <text x="1480" y="365"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="16" font-weight="600" fill="#5A5A70" text-anchor="end"
        letter-spacing="0.6">
    KULTIVAR.IO
  </text>
</svg>
