<?xml version="1.0" encoding="UTF-8"?>
<!--
  Twitter / X header banner — 1500 × 500.

  Safe area note: Twitter crops the bottom edge slightly on mobile.
  The wordmark + tagline are vertically centered with ~80px breathing
  room top/bottom to survive any crop.

  Profile-picture overlay: Twitter overlays a circular profile pic
  in the bottom-left corner that occupies roughly a 200×200 area.
  Design steers wordmark + tagline rightward so the avatar doesn't
  obscure them.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-label="Kultivar — your grow journal, not theirs">
  <!-- Background -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#00C896" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#00C896" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1500" height="500" fill="#0A0A0F"/>
  <rect width="1500" height="500" fill="url(#glow)"/>

  <!-- Subtle grid texture -->
  <g opacity="0.04" stroke="#00C896" stroke-width="1" fill="none">
    <line x1="0" y1="100" x2="1500" y2="100"/>
    <line x1="0" y1="200" x2="1500" y2="200"/>
    <line x1="0" y1="300" x2="1500" y2="300"/>
    <line x1="0" y1="400" x2="1500" y2="400"/>
  </g>

  <!-- Kultivar icon (K monogram on rounded green square) -->
  <g transform="translate(320, 170)">
    <rect width="80" height="80" rx="18" fill="#00C896" filter="drop-shadow(0 0 24px rgba(0,200,150,0.55))"/>
    <!-- Stylised K -->
    <path d="M 22 18 L 22 62 M 22 40 L 50 18 M 22 40 L 56 62"
          stroke="#0A0A0F" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Wordmark -->
  <text x="430" y="230"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif"
        font-size="68" font-weight="700" letter-spacing="-1.5" fill="#F0F0FF">
    Kultivar
  </text>

  <!-- Tagline -->
  <text x="430" y="290"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif"
        font-size="30" font-weight="500" letter-spacing="-0.4" fill="#9090AA">
    Your grow journal. <tspan fill="#00C896" font-weight="700">Not theirs.</tspan>
  </text>

  <!-- URL chip bottom right -->
  <g transform="translate(1180, 420)">
    <rect width="240" height="44" rx="22" fill="none" stroke="#26263B" stroke-width="1"/>
    <text x="120" y="29"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif"
          font-size="16" font-weight="600" fill="#00C896" text-anchor="middle"
          letter-spacing="0.4">
      KULTIVAR.IO
    </text>
  </g>
</svg>
