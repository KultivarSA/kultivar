name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Static analysis — fails on errors / warnings, allows info-level lints.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # Unit tests live in test/**/*_test.dart.  Integration / golden tests
      # would go in test/integration/ and integration_test/ respectively
      # (not yet wired up — see test/README.md when it exists).
      - name: Test
        run: flutter test --coverage --reporter=expanded

      # Surface coverage as a build artefact so reviewers can pull it down.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
