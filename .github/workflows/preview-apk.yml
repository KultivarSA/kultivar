name: preview-apk

# Builds an installable release APK (universal) for sideloading onto a
# real device.  The release-aab workflow produces a Play Store bundle,
# which CANNOT be installed directly — this exists to try a branch on
# actual hardware.  Same clean-runner rationale as release-aab: local
# Gradle builds are blocked by the dev machine's EDR.
#
# Trigger: Actions -> preview-apk -> Run workflow (pick a branch).
#
# Reuses the same secrets as release-aab (keystore, signing passwords,
# ENV_JSON base64).  See release-aab.yml for the secret list.

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.6"
          cache: true

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$GITHUB_WORKSPACE/android/app/upload-keystore.jks"

      - name: Write android/key.properties
        env:
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > "$GITHUB_WORKSPACE/android/key.properties" <<EOF
          storePassword=${STORE_PW}
          keyPassword=${KEY_PW}
          keyAlias=${KEY_ALIAS:-kultivar-upload}
          storeFile=${GITHUB_WORKSPACE}/android/app/upload-keystore.jks
          EOF

      - name: Write env.json (compile-time secrets, base64)
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          printf '%s' "$ENV_JSON" | tr -d '\r\n ' | base64 -d > "$GITHUB_WORKSPACE/env.json"

      - name: Install dependencies
        run: flutter pub get

      - name: Build installable release APK (universal)
        run: flutter build apk --release --dart-define-from-file=env.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Scrub secrets from workspace
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/android/app/upload-keystore.jks" \
                "$GITHUB_WORKSPACE/android/key.properties" \
                "$GITHUB_WORKSPACE/env.json" || true
