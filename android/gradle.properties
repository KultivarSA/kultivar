org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Force modern TLS -- older Java versions default to TLS 1.0 / 1.1
# which Maven Central no longer accepts.  Symptom without these:
# "Remote host terminated the handshake" during dependency resolution.
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.jdk.tls.client.protocols=TLSv1.2,TLSv1.3

# Enable Gradle daemon + parallel + caching for faster repeat builds.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Allow the Kotlin-17 / Java-8 target split inside third-party plugin
# AARs (home_widget, audioplayers_android, … hardcode compileOptions
# VERSION_1_8, which AGP finalizes before we can override; we lift only
# their Kotlin jvmTarget to 17 in build.gradle.kts to fix home_widget's
# JVM-11 inline error).  Downgrades the "Inconsistent JVM-target" check
# from error to warning — the mixed class-file versions dex to one DEX
# via D8 at app assembly, so it is safe.  See kotl.in/gradle/jvm/target-validation
kotlin.jvm.target.validation.mode=warning
