org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Force modern TLS -- older Java versions default to TLS 1.0 / 1.1
# which Maven Central no longer accepts.  Symptom without these:
# "Remote host terminated the handshake" during dependency resolution.
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.jdk.tls.client.protocols=TLSv1.2,TLSv1.3

# Enable Gradle daemon + parallel + caching for faster repeat builds.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
